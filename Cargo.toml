[package]
name = "gpu-arbiter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "gpu-arbiter"
path = "src/bin/gpu-arbiter.rs"

[[bin]]
name = "gpu-run"
path = "src/bin/gpu-run.rs"

[[bin]]
name = "ninfer-mock"
path = "src/bin/ninfer-mock.rs"

[dependencies]
bytes = "1"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "sync", "fs"] }

[features]
python = ["dep:pyo3"]

[dependencies.pyo3]
version = "0.30.1"
optional = true
features = ["extension-module"]
